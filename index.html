<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thembulls Towing LLC — towing, roadside assistance, and lockout service in Philadelphia.">
  <title>Thembulls Towing LLC</title>
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;text-align:center;background:radial-gradient(circle at top,#333 0%,#111 45%,#000 100%)}
    header{padding:28px 16px;background:#000;border-bottom:4px solid #f4b400}
    h1{margin:0;color:#f4b400;font-size:clamp(32px,8vw,58px)}
    header p{margin:10px 0 0;font-size:clamp(16px,4vw,22px)}
    main{width:min(92%,900px);margin:auto;padding:50px 15px}
    h2{color:#f4b400;font-size:clamp(25px,6vw,40px)}
    .intro{font-size:18px;line-height:1.6}
    .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:34px 0}
    .service{padding:25px 12px;background:#1b1b1b;border:2px solid #f4b400;border-radius:14px;font-size:19px;font-weight:bold}
    .button{display:block;width:min(100%,430px);margin:18px auto;padding:18px 20px;border-radius:11px;color:#000;background:#f4b400;text-decoration:none;font-size:21px;font-weight:bold}
    .button:hover{background:#ffd34d}
    .game-button{color:#f4b400;background:transparent;border:2px solid #f4b400}
    footer{padding:24px 15px;color:#aaa;background:#000;border-top:2px solid #f4b400}
  </style>
</head>
<body>
  <header>
    <h1>Thembulls Towing LLC</h1>
    <p>Towing • Roadside Assistance • Lockouts</p>
  </header>
  <main>
    <h2>Reliable Service When You Need Us</h2>
    <p class="intro">Professional towing and roadside assistance throughout Philadelphia.</p>
    <section class="services" aria-label="Services">
      <div class="service">Towing</div>
      <div class="service">Roadside Assistance</div>
      <div class="service">Vehicle Lockouts</div>
    </section>
    <a class="button" href="tel:2677612883">Call 267-761-2883</a>
    <a class="button game-button" href="game/">Play Thembulls Tow Run</a>
  </main>
  <footer>© 2026 Thembulls Towing LLC</footer>
</body>
</html>
